<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="glassBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.18)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.04)" />
    </linearGradient>
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.35)" />
      <stop offset="30%" stop-color="rgba(255, 255, 255, 0.05)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0.5)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FFFFFF" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Glass Squircle Frame -->
  <rect width="120" height="120" rx="26" fill="url(#glassBody)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
  <rect width="120" height="120" rx="26" fill="url(#glassSheen)" />

  <!-- Specular White IE Icon Mark -->
  <g fill="#FFFFFF" transform="translate(10, 10)" filter="url(#glow)">
    <path d="M 14 14 H 30 V 86 H 14 Z" />
    <path d="M 43 14 H 86 L 70 30 H 43 Z" />
    <path d="M 43 42 H 68 V 58 H 43 Z" />
    <path d="M 43 70 H 86 L 70 86 H 43 Z" />
  </g>
</svg>
